name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  pipeline-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pipeline and test dependencies
        run: python -m pip install --upgrade pip pytest coverage==7.16.2 ./data-pipeline
      - name: Run pipeline tests
        working-directory: data-pipeline
        run: |
          PYTHONPATH=src python -m coverage run --branch --source=src -m pytest -q
          python -m coverage xml -o coverage.xml
      - name: Preserve doompedia-pipeline coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-doompedia-pipeline
          path: data-pipeline/coverage.xml
          if-no-files-found: error
          retention-days: 7
      - name: Upload doompedia-pipeline coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CODECOV_UPLOAD_ENABLED == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: false
          files: ./data-pipeline/coverage.xml
          disable_search: true
          fail_ci_if_error: true
          version: v11.3.1
          cleanup: true

  hardened-web-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build canonical web image
        run: docker build --file deploy/Dockerfile --tag doompedia-web:ci .
      - name: Verify hardened runtime
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force doompedia-web-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name doompedia-web-ci \
            --init \
            --read-only \
            --tmpfs /config:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001 \
            --tmpfs /data:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --pids-limit 128 \
            --memory 256m \
            --mount type=bind,src="$PWD/web",dst=/srv,readonly \
            --publish 127.0.0.1:18080:8080 \
            doompedia-web:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/index.html >/dev/null; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' doompedia-web-ci)" != running ]; then
              docker logs doompedia-web-ci
              exit 1
            fi
            sleep 1
          done
          docker logs doompedia-web-ci
          exit 1

  android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2"'
      - name: Run Android unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --stacktrace --console=plain

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate
      - name: Resolve simulator destination
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "${SIM_ID:-}" ]; then
            echo "No available iPhone simulator found on runner"
            exit 1
          fi
          echo "IOS_SIM_DEST=id=$SIM_ID" >> "$GITHUB_ENV"
      - name: Build iOS app (no signing)
        working-directory: ios-app
        run: |
          xcodebuild \
            -project Doompedia.xcodeproj \
            -scheme Doompedia \
            -sdk iphonesimulator \
            -destination "$IOS_SIM_DEST" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run iOS unit tests
        working-directory: ios-app
        run: |
          xcodebuild \
            -project Doompedia.xcodeproj \
            -scheme Doompedia \
            -sdk iphonesimulator \
            -destination "$IOS_SIM_DEST" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Package simulator .app
        working-directory: ios-app
        run: |
          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData -type d -name Doompedia.app | head -n 1)"
          test -n "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" doompedia-ios-simulator-debug.zip
      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doompedia-ios-simulator-debug
          path: ios-app/doompedia-ios-simulator-debug.zip
