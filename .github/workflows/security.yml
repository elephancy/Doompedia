name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 2'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scans:
    uses: elephancy/.github/.github/workflows/security.yml@8137135f6294481c6df7bcad8c29241d05620ad9
    with:
      runner: '["ubuntu-24.04"]'
      policy-source-sha: 8137135f6294481c6df7bcad8c29241d05620ad9
