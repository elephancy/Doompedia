name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 2'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scans:
    uses: elephancy/.github/.github/workflows/security.yml@333757db6f00d2caacf4df94ceabb657d7b8569f
    with:
      runner: '["ubuntu-24.04"]'
      policy-source-sha: 333757db6f00d2caacf4df94ceabb657d7b8569f
