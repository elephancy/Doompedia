name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 2'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scans:
    uses: elephancy/.github/.github/workflows/security.yml@6da93d98c823e48cd473e325b5d7e50184915b30
    with:
      runner: '["ubuntu-24.04"]'
      policy-source-sha: 6da93d98c823e48cd473e325b5d7e50184915b30
